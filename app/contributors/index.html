<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The List — Contributors</title>
<meta name="theme-color" content="#C8102E" />
<meta name="description" content="The people who built The List — every spot on the guide came from one of them." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../menu.css" />

<style>
  .band-in { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 20px; padding-bottom: 18px; }
  .tagline { margin: 10px 0 0; line-height: 1.35; color: #FFE3E6; max-width: 34ch; }
  .back { margin-bottom: 8px; }
  @media (max-width: 520px) { .band-in { flex-direction: column; align-items: flex-start; } }
  .menu-h .ct { font-size: .5em; font-weight: 600; font-variation-settings: "wdth" 100; color: var(--soft); margin-left: 6px; text-transform: none; letter-spacing: 0; }
  .roster { list-style: none; padding: 0; margin: 0; max-width: 640px; }
  .it { display: grid; grid-template-columns: 40px 1fr; column-gap: 6px; align-items: baseline; padding: 9px 0; break-inside: avoid; }
  .no { text-align: center; font: 800 1.05rem/1 var(--sans); font-variant-numeric: tabular-nums; }
  .dish { margin: 0; font: 700 1.2rem/1.15 var(--sans); display: flex; align-items: baseline; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
  .note { margin: 6px 0 0; color: var(--soft); }
</style>
</head>
<body>
  <header class="band">
    <div class="wrap band-in">
      <div>
        <a class="back" href="../"><svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>The List</a>
        <h1 class="page-title">Contributors</h1>
        <p class="tagline">Every spot on the guide came from someone who ate there.</p>
      </div>
      <a class="btn-paper" href="../entry/">+ Add a spot</a>
    </div>
  </header>

  <main class="wrap">
    <h2 class="menu-h" id="count">Loading</h2>
    <p class="note" id="loading">Fetching the list.</p>
    <ol class="roster" id="roster"></ol>
  </main>

  <footer class="foot">
    <div class="wrap foot-in">
      <span>The List &middot; Built by friends, for friends</span>
      <span><a href="../entry/">Add a spot</a> &middot; <a href="../">The List</a></span>
    </div>
  </footer>

  <script src="../config.js"></script>
  <script>
  (function () {
    const API_BASE = window.API_BASE || "";
    // Founders are the offline fallback if the API can't be reached.
    const FALLBACK = ["jonathan.g", "sharon.g", "euginia.w", "jeremy.t", "joshua.r"];
    const roster = document.getElementById("roster");
    const countEl = document.getElementById("count");
    const loadingEl = document.getElementById("loading");

    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    function render(list) {
      loadingEl.hidden = true;
      const n = list.length;
      countEl.textContent = n + (n === 1 ? " contributor" : " contributors");
      roster.innerHTML = list.map((h, i) =>
        `<li class="it"><span class="no">${i + 1}</span><p class="dish">${esc(h)}</p></li>`
      ).join("");
    }

    fetch(API_BASE + "/api/contributors", { headers: { Accept: "application/json" } })
      .then((r) => { if (!r.ok) throw new Error("api"); return r.json(); })
      .then((d) => render((d && d.contributors) || FALLBACK))
      .catch(() => render(FALLBACK));
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The List — Where to eat, and what to order</title>
<meta name="description" content="A hand-built guide to the exact dishes to order, city by city." />
<meta name="theme-color" content="#C8102E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="menu.css" />
<style>
  /* ---------- Masthead ---------- */
  .band-in { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 20px; padding-bottom: 18px; }
  .tagline { margin: 10px 0 0; font-size: 1rem; line-height: 1.35; color: #FFE3E6; max-width: 34ch; }
  .band-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: none; }
  @media (max-width: 520px) {
    .band-in { flex-direction: column; align-items: stretch; gap: 14px; }
    .band-actions { flex-direction: row; align-items: center; justify-content: space-between; }
  }
  .band-actions .link { color: #fff; font-weight: 600; font-size: .95rem; }

  /* ---------- City tabs ---------- */
  .tabs-wrap { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px solid var(--red); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; appearance: none; background: none; border: 0; cursor: pointer;
    font: 700 1.05rem/1 var(--sans); font-variation-settings: "wdth" 80;
    color: var(--soft); padding: 14px 12px 12px; display: flex; align-items: baseline; gap: 6px;
  }
  .tab:first-child { padding-left: 0; }
  .tab .n { font-weight: 500; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .tab .wip { align-self: center; font: 700 .65rem/1 var(--sans); letter-spacing: .04em; color: var(--red); border: 1.5px solid currentColor; border-radius: 4px; padding: 2px 4px; }
  .tab:hover { color: var(--ink); }
  .tab .short { display: none; }
  @media (max-width: 520px) { .tab .full { display: none; } .tab .short { display: inline; } .tabs { justify-content: space-between; } }
  .tab[aria-selected="true"] { color: var(--red); box-shadow: inset 0 -4px 0 var(--red); }

  /* ---------- Tools ---------- */
  .tools { padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .search { position: relative; display: block; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--soft); pointer-events: none; }
  .search input {
    width: 100%; height: 46px; padding: 0 14px 0 42px; font: 400 1rem var(--sans);
    color: var(--ink); background: #fff; border: 1.5px solid var(--ink); border-radius: 8px;
  }
  .search input::placeholder { color: var(--soft); }
  .search input:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

  .find { display: flex; gap: 8px; }
  .find .search { flex: 1; min-width: 0; }
  .fbtn {
    flex: none; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; cursor: pointer;
    font: 600 1rem var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--ink); border-radius: 8px;
    transition: background-color .15s ease, color .15s ease;
  }
  .fbtn:hover:not(:disabled) { background: var(--ink); color: #fff; }
  .fbtn:disabled { opacity: .45; cursor: default; }
  .fbtn svg { width: 18px; height: 18px; flex: none; }
  .badge {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff;
    font: 700 .8rem/22px var(--sans); font-variant-numeric: tabular-nums; text-align: center;
  }

  /* ---------- Filter sheet: bottom sheet on phones, centered panel on wide screens ---------- */
  .sheet {
    width: 100%; max-width: none; max-height: min(88dvh, 760px); margin: auto 0 0; padding: 0; border: 0;
    border-radius: 14px 14px 0 0; background: var(--paper); color: var(--ink); flex-direction: column; overflow: hidden;
  }
  .sheet[open] { display: flex; animation: sheet-up .36s cubic-bezier(.16,1,.3,1); }
  .sheet::backdrop { background: rgb(20 20 20 / .5); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  @keyframes sheet-in { from { transform: translateY(16px); opacity: 0; } }
  @media (min-width: 760px) {
    .sheet { margin: auto; width: min(560px, calc(100% - 64px)); border-radius: 12px; }
    .sheet[open] { animation-name: sheet-in; }
  }
  html:has(.sheet[open]) { overflow: hidden; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 2px solid var(--red); }
  .sheet-head h2 { margin: 0; color: var(--red); font: 900 2rem/1 var(--sans); font-variation-settings: "wdth" 62; text-transform: uppercase; }
  .x { width: 44px; height: 44px; margin-right: -6px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--ink); cursor: pointer; }
  .x:hover { background: var(--rule); }
  .x svg { width: 22px; height: 22px; }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 22px; }
  .fgroup { border: 0; margin: 24px 0 0; padding: 0; min-width: 0; }
  .fgroup legend { padding: 0; margin-bottom: 12px; font: 700 1.05rem/1 var(--sans); font-variation-settings: "wdth" 80; text-transform: uppercase; }
  .fchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .chip { min-height: 44px; padding: 0 16px; font-size: .95rem; }
  .sheet-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1.5px solid var(--rule);
  }
  .sheet-foot .btn-red { min-width: 150px; font-variant-numeric: tabular-nums; }

  .tally { display: flex; align-items: center; gap: 12px; font-size: .95rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .tally b { color: var(--ink); font-weight: 700; }
  .tally .bar { flex: 1; max-width: 220px; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .tally .bar span { display: block; height: 100%; background: var(--red); transition: width .5s cubic-bezier(.16,1,.3,1); }
  .tally .key { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tally .key svg { width: 30px; height: 24px; overflow: visible; }
  .clear { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font: 600 .95rem var(--sans); color: var(--red); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Menu ---------- */
  .menu { padding: 6px 0 40px; }
  @media (min-width: 760px) { .menu { columns: 2 340px; column-gap: 56px; column-rule: 1.5px dotted var(--rule); } }
  @media (min-width: 1100px) { .menu { columns: 3 300px; } }

  .sec h2 {
    margin: 22px 0 2px; color: var(--red);
    font: 900 2rem/1 var(--sans); font-variation-settings: "wdth" 62; text-transform: uppercase; letter-spacing: .01em;
    break-after: avoid;
  }
  .sec h2 .ct { font-size: .5em; font-weight: 600; font-variation-settings: "wdth" 100; color: var(--soft); margin-left: 6px; vertical-align: .35em; letter-spacing: 0; text-transform: none; }
  .sec { break-inside: avoid-column; }
  .sec:first-child h2 { margin-top: 16px; }

  .it { display: grid; grid-template-columns: 40px 1fr auto; column-gap: 6px; align-items: last baseline; padding: 9px 0; break-inside: avoid; }
  .no { align-self: start; position: relative; font: 800 1.05rem/calc(1.2rem * 1.15) var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  .no svg { position: absolute; left: 50%; top: 50%; width: 44px; height: 36px; transform: translate(-50%, -54%); overflow: visible; pointer-events: none; }
  .no path, .key path { fill: none; stroke: var(--pen); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 160; stroke-dashoffset: 0; }
  .menu.draw .no path { animation: pen .55s cubic-bezier(.3,.1,.2,1) both; animation-delay: var(--d, 0s); }
  @keyframes pen { from { stroke-dashoffset: 160; } }
  .dish { margin: 0; font: 700 1.2rem/1.15 var(--sans); min-width: 0; overflow: clip; }
  /* Dot leader runs from the dish's last word to the price, clipped at the column edge. */
  .dish::after { content: "\00a0 . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."; display: inline-block; width: 0; white-space: nowrap; color: #BFB0AA; font-weight: 600; letter-spacing: .08em; }
  .pr { font: 700 1.05rem/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .pl { grid-column: 2 / 4; margin-top: 3px; font-size: .95rem; color: var(--soft); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .pl a { color: var(--ink); font-weight: 600; text-decoration-color: var(--rule); display: inline-flex; align-items: center; gap: 5px; }
  .pl a:hover { text-decoration-color: var(--red); }
  .pl a svg { width: 14px; height: 14px; color: var(--red); flex: none; }
  .pl .nm { color: var(--ink); font-weight: 600; }

  .empty { padding: 40px 0 60px; column-span: all; }
  .empty h2 { font: 900 2rem/1 var(--sans); font-variation-settings: "wdth" 62; color: var(--red); text-transform: uppercase; margin: 0 0 8px; }
  .empty p { margin: 0 0 14px; color: var(--soft); max-width: 46ch; }
</style>
</head>
<body>
  <header class="band">
    <div class="wrap band-in">
      <div>
        <a class="mark" href="./">The List</a>
        <p class="tagline">The exact dish to order, city by city.</p>
      </div>
      <div class="band-actions">
        <a class="btn-paper" href="entry/">+ Add a spot</a>
        <a class="link" href="contributors/">Contributors</a>
      </div>
    </div>
  </header>

  <div class="tabs-wrap">
    <nav class="wrap tabs" id="cities" role="tablist" aria-label="City"></nav>
  </div>

  <main class="wrap">
    <div class="tools">
      <div class="find">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Search a dish, place or area" autocomplete="off" aria-label="Search" />
        </label>
        <button class="fbtn" id="filterBtn" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>
          <span>Filters</span><span class="badge" id="filterCount" hidden></span>
        </button>
      </div>
      <div class="tally">
        <span><b id="progNum">0</b> of <span id="progTot">0</span> tried</span>
        <span class="bar" aria-hidden="true"><span id="progBar" style="width:0%"></span></span>
        <span class="key" id="resCount"></span>
      </div>
    </div>

    <div class="menu" id="menu" aria-live="polite"></div>
  </main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Filters</h2>
      <button class="x" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <button class="clear" id="sheetClear" type="button">Clear</button>
      <button class="btn-red" id="sheetApply" type="button">Show</button>
    </div>
  </dialog>

  <footer class="foot">
    <div class="wrap foot-in">
      <span>The List · <b id="footTotal">—</b> spots</span>
      <span><a href="entry/">Add a spot</a> · <a href="contributors/">Contributors</a></span>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script>
  (function () {
    const API_BASE = window.API_BASE || "";
    let DATA = [];
    const state = { city: undefined, q: "", status: "all", cuisines: [], price: null };

    const $ = (s) => document.querySelector(s);
    const menu = $("#menu");
    const cityById = (id) => DATA.find((c) => c.id === id);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function esc(s) {
      return (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    // Menu order: cuisine, then name. Numbers are fixed per city so filters never renumber a dish.
    function numbered(c) {
      return c.places
        .slice()
        .sort((a, b) => (a.cuisine || "").localeCompare(b.cuisine || "") || a.name.localeCompare(b.name))
        .map((p, i) => ({ ...p, no: i + 1 }));
    }

    const SHORT = { la: "LA", sf: "SF", ny: "NY", sd: "SD" };

    // ---- City tabs ----
    function renderCities() {
      const el = $("#cities");
      el.innerHTML = DATA.map((c) => `
        <button class="tab" role="tab" data-city="${c.id}" aria-selected="${c.id === state.city}" aria-label="${esc(c.name)}, ${c.count} spots${c.wip ? ", work in progress" : ""}">
          <span class="full">${esc(c.name)}</span><span class="short">${SHORT[c.id] || esc(c.name)}</span>${c.wip ? `<span class="wip" aria-hidden="true">WIP</span>` : `<span class="n">${c.count}</span>`}
        </button>`).join("");
      el.querySelectorAll(".tab").forEach((b) =>
        b.addEventListener("click", () => setCity(b.dataset.city)));
    }

    function setCity(id) {
      state.city = id;
      state.cuisines = []; state.price = null; state.q = ""; state.status = "all";
      $("#search").value = "";
      document.querySelectorAll(".tab").forEach((b) =>
        b.setAttribute("aria-selected", b.dataset.city === id));
      renderCityHead();
      syncFilterBtn();
      render(true);
    }

    function renderCityHead() {
      const c = cityById(state.city);
      const tried = c.places.filter((p) => p.tried).length;
      $("#progNum").textContent = tried;
      $("#progTot").textContent = c.count;
      $("#progBar").style.width = (c.count ? (tried / c.count) * 100 : 0) + "%";
    }

    // ---- Filter sheet: edits a draft; "Show" applies it, any other close discards it ----
    const sheet = $("#sheet");
    let draft = null;

    function syncFilterBtn() {
      const n = (state.status !== "all") + !!state.price + state.cuisines.length;
      const badge = $("#filterCount");
      badge.hidden = !n;
      badge.textContent = n;
      $("#filterBtn").setAttribute("aria-label", n ? `Filters, ${n} on` : "Filters");
      $("#filterBtn").disabled = !cityById(state.city).count;
    }

    function openSheet() {
      const c = cityById(state.city);
      draft = { status: state.status, price: state.price, cuisines: [...state.cuisines] };
      const uniq = (k) => [...new Set(c.places.map((p) => p[k]).filter(Boolean))];
      const prices = uniq("price").sort((a, b) => a.length - b.length);
      const cuisines = uniq("cuisine").sort((a, b) => a.localeCompare(b));
      const chip = (kind, val, label) =>
        `<button type="button" class="chip" data-kind="${kind}" data-val="${esc(val)}">${esc(label)}</button>`;
      const group = (title, chips) => chips ? `<fieldset class="fgroup"><legend>${title}</legend><div class="fchips">${chips}</div></fieldset>` : "";
      $("#sheetBody").innerHTML =
        group("Status", chip("status", "want", "Not yet") + chip("status", "tried", "Tried")) +
        group("Price", prices.map((pr) => chip("price", pr, pr)).join("")) +
        group("Cuisine", cuisines.map((cu) => chip("cuisines", cu, cu)).join(""));
      syncSheet();
      sheet.showModal();
    }

    function syncSheet() {
      sheet.querySelectorAll(".chip").forEach((b) => {
        const k = b.dataset.kind, v = b.dataset.val;
        b.setAttribute("aria-pressed", k === "cuisines" ? draft.cuisines.includes(v) : draft[k] === v);
      });
      const n = filtered({ ...state, ...draft }).length;
      const go = $("#sheetApply");
      go.disabled = !n;
      go.textContent = n ? `Show ${n}` : "No matches";
    }

    $("#sheetBody").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      const k = b.dataset.kind, v = b.dataset.val;
      if (k === "cuisines") draft.cuisines = draft.cuisines.includes(v) ? draft.cuisines.filter((x) => x !== v) : [...draft.cuisines, v];
      else draft[k] = draft[k] === v ? (k === "status" ? "all" : null) : v;
      syncSheet();
    });
    $("#filterBtn").addEventListener("click", openSheet);
    $("#sheetClose").addEventListener("click", () => sheet.close());
    $("#sheetClear").addEventListener("click", () => { draft = { status: "all", price: null, cuisines: [] }; syncSheet(); });
    $("#sheetApply").addEventListener("click", () => {
      Object.assign(state, draft);
      sheet.close();
      syncFilterBtn();
      render();
    });
    // Clicks on the dialog element itself land on the backdrop.
    sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });

    // ---- Filtering + render ----
    function filtered(f = state) {
      const q = f.q.trim().toLowerCase();
      return numbered(cityById(f.city)).filter((p) => {
        if (f.status === "tried" && !p.tried) return false;
        if (f.status === "want" && p.tried) return false;
        if (f.cuisines.length && !f.cuisines.includes(p.cuisine)) return false;
        if (f.price && p.price !== f.price) return false;
        if (q) {
          const hay = `${p.name} ${p.description} ${p.cuisine} ${p.location}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    const YELP_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m7.69 15.14-3.67.85c-.38.09-.76.18-1.15.16-.26-.02-.51-.04-.76-.21a1.18 1.18 0 0 1-.33-.36c-.35-.55-.37-1.37-.37-2a6.29 6.29 0 0 1 .33-2.06c.03-.09.07-.17.11-.25.04-.07.08-.15.13-.22.05-.07.1-.13.16-.2.11-.12.25-.22.4-.28.15-.06.3-.09.46-.08.24 0 .51.05.91.17l.19.06c.33.1.7.24 1.15.4.69.24 1.37.49 2.05.74l1.21.44c.22.08.44.18.64.3.17.1.33.23.45.39.09.13.16.28.19.43a1.22 1.22 0 0 1-.87 1.45l-.11.03-1.11.26zM18.82 7.57a1.85 1.85 0 0 0-.2-.18 2.4 2.4 0 0 0-.21-.14 2.36 2.36 0 0 0-.23-.11 1.17 1.17 0 0 0-.48-.08c-.16.01-.31.05-.45.13-.21.1-.44.27-.74.55l-.14.13c-.25.24-.53.53-.86.86-.51.52-1.02 1.04-1.52 1.56l-.9.93c-.17.17-.32.35-.45.55-.11.17-.19.35-.24.55-.03.15-.03.3.01.45v.02a1.22 1.22 0 0 0 1.42.92l.11-.02 4.78-1.1c.38-.09.76-.17 1.1-.36.23-.13.44-.26.59-.53.07-.14.12-.31.14-.47.07-.65-.27-1.39-.54-1.96a6.28 6.28 0 0 0-1.2-1.71zM8.97.08c-.28.04-.56.09-.83.16-.28.06-.55.14-.81.22-.87.28-2.09.81-2.3 1.81-.12.57.16 1.14.37 1.66.26.63.61 1.19.94 1.78.85 1.55 1.72 3.1 2.59 4.65.26.46.54 1.05 1.04 1.29l.1.04c.22.09.47.1.7.05h.04c.22-.06.41-.18.57-.34l.08-.08c.35-.44.35-1.08.38-1.61.1-1.77.21-3.54.3-5.31.03-.67.11-1.33.07-2.01-.03-.56-.04-1.2-.39-1.66-.62-.81-1.95-.74-2.85-.62zm2.08 15.95a1.1 1.1 0 0 0-1.23-.41l-.15.06c-.08.04-.15.08-.22.14-.2.15-.37.34-.52.53-.04.05-.07.11-.12.16l-.77 1.06c-.43.59-.86 1.19-1.29 1.79-.28.39-.52.72-.71 1.01l-.11.16c-.23.35-.36.61-.42.84-.04.15-.05.31-.05.47.02.17.08.32.16.47.05.07.1.14.15.21.05.06.11.13.18.18.07.06.14.12.21.17.53.37 1.11.63 1.72.84.51.17 1.04.27 1.57.3h.27c.09-.01.17-.02.25-.04.08-.02.17-.04.24-.07.16-.06.3-.15.42-.27.11-.11.2-.25.25-.4.09-.22.15-.5.19-.92l.02-.2c.03-.35.04-.75.07-1.23.04-.74.07-1.47.09-2.2l.05-1.31c.01-.3 0-.63-.08-.93a1.4 1.4 0 0 0-.18-.41zm8.68 2.04c-.16-.18-.39-.35-.75-.57l-.17-.1c-.3-.18-.66-.37-1.08-.6-.64-.35-1.29-.7-1.94-1.04l-1.15-.61c-.06-.02-.12-.06-.18-.09-.22-.11-.46-.2-.7-.25l-.25-.03h-.16a1.1 1.1 0 0 0-.92.91c-.02.15-.02.29.02.44.06.31.19.61.33.88l.62 1.15c.34.65.69 1.3 1.04 1.94.23.42.42.78.6 1.08l.1.17c.22.36.39.58.57.75.11.11.25.2.4.25.16.05.33.07.49.05l.25-.04.24-.08.25-.11c.47-.26.9-.58 1.28-.96.46-.45.87-.95 1.18-1.51.04-.08.08-.16.11-.25l.08-.24c.02-.08.03-.17.04-.25.01-.17-.01-.33-.06-.49a1.1 1.1 0 0 0-.25-.4z"/></svg>`;

    // A slightly different hand-drawn loop for each number, stable across renders.
    const LOOPS = [
      "M33 7.5C27 3.6 13 4 6.5 10.5 1.6 15.4 3.4 25.5 11 29.6c7.6 4.1 20.6 3.5 27-2.4 5.3-4.9 4.6-13.6-1.4-18.3C31.4 4.8 22.5 3.8 16.8 5.2",
      "M10 7.2C16.5 3.4 30.4 3.6 36.8 9.6c5 4.7 4 14.3-2.6 19-6.9 4.9-19.6 5.1-26.6.4C1.9 25.1 1.7 16.2 6.8 11 11.3 6.4 19.6 4.4 26.4 5.4",
      "M29.5 5.3C21.5 3 10.2 5 5.3 11.4 1.5 16.5 3.6 25 10.9 28.9c7.4 3.9 19.5 3.6 25.6-1.5 5.7-4.8 5.4-13.6-.8-18.5-4.2-3.3-9.7-4.4-14.6-3.9",
    ];
    function pen(no) {
      const r = ((no * 37) % 13) - 6;
      return `<svg viewBox="0 0 44 36" aria-hidden="true"><path d="${LOOPS[no % 3]}" transform="rotate(${r} 22 18)"/></svg>`;
    }

    function item(p, i) {
      const dish = p.description || "Chef’s choice";
      const c = cityById(state.city);
      const place = p.yelp
        ? `<a href="${esc(p.yelp)}" target="_blank" rel="noopener">${esc(p.name)}${YELP_SVG}<span class="sr">on Yelp (opens in new tab)</span></a>`
        : `<span class="nm">${esc(p.name)}</span>`;
      const area = p.location && p.location !== c.name ? `<span>${esc(p.location)}</span>` : "";
      return `
        <div class="it">
          <span class="no" style="--d:${Math.min(i, 14) * 0.04}s">${p.no}${p.tried ? pen(p.no) + '<span class="sr">, tried</span>' : ""}</span>
          <h3 class="dish">${esc(dish)}</h3>
          <span class="pr">${esc(p.price || "")}</span>
          <div class="pl">${place}${area}${!p.description && p.id ? `<button class="clear" data-suggest="${p.id}" data-name="${esc(p.name)}">Suggest dish</button>` : ""}</div>
        </div>`;
    }

    function render(draw) {
      const list = filtered();
      const c = cityById(state.city);
      const anyFilter = state.q || state.status !== "all" || state.cuisines.length || state.price;

      if (!c.count) {
        menu.className = "menu";
        menu.innerHTML = `<div class="empty"><h2>Work in progress</h2><a class="btn-red" href="entry/">Add a spot</a></div>`;
      } else if (!list.length) {
        menu.className = "menu";
        menu.innerHTML = `<div class="empty"><h2>Not on the menu</h2><p>Nothing in ${esc(c.name)} matches that. Try fewer filters or another search.</p><button class="btn-red" id="emptyClear">Clear filters</button></div>`;
        $("#emptyClear").addEventListener("click", clearAll);
      } else {
        // In multi-column layout, long cuisines split into chunks so columns balance; later chunks say "cont.".
        const max = WIDE.matches ? 6 : Infinity;
        const groups = [];
        for (const p of list) {
          const last = groups[groups.length - 1];
          if (last && last.cuisine === p.cuisine && last.items.length < max) last.items.push(p);
          else groups.push({ cuisine: p.cuisine, items: [p], cont: !!last && last.cuisine === p.cuisine, total: 0 });
        }
        for (const g of groups) g.total = list.filter((p) => p.cuisine === g.cuisine).length;
        let i = 0;
        menu.innerHTML = groups.map((g) => `
          <section class="sec${g.cont ? " cont" : ""}">
            <h2>${esc(g.cuisine || "Other")}<span class="ct">${g.cont ? "cont." : g.total}</span></h2>
            ${g.items.map((p) => item(p, i++)).join("")}
          </section>`).join("");
        // A "cont." chunk that landed in the same column as its section merges back into it.
        menu.querySelectorAll(".sec.cont").forEach((sec) => {
          const prev = sec.previousElementSibling;
          if (prev && prev.offsetLeft === sec.offsetLeft) { prev.append(...sec.querySelectorAll(".it")); sec.remove(); }
        });
        // Pen circles draw in only when a city opens, not on every keystroke.
        menu.className = "menu" + (draw && !reduceMotion ? " draw" : "");
      }

      $("#resCount").innerHTML = anyFilter
        ? `${list.length} shown · <button class="clear" id="clearBtn">Clear</button>`
        : `<svg viewBox="0 0 44 36" aria-hidden="true"><path d="${LOOPS[0]}"/></svg> = tried`;
      const cb = $("#clearBtn");
      if (cb) cb.addEventListener("click", clearAll);
    }

    function clearAll() {
      state.q = ""; state.status = "all"; state.cuisines = []; state.price = null;
      $("#search").value = "";
      syncFilterBtn();
      render();
    }

    const WIDE = matchMedia("(min-width: 760px)");
    WIDE.addEventListener("change", () => { if (state.city) render(); });

    // Chef's-choice places: suggestions land in the admin review queue.
    menu.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-suggest]");
      if (!b) return;
      const dish = (prompt(`What should people order at ${b.dataset.name}?`) || "").trim();
      if (!dish) return;
      const submitted_by = (prompt("Your name?") || "").trim();
      if (!submitted_by) return;
      b.disabled = true;
      try {
        const r = await fetch(API_BASE + "/api/entries/" + b.dataset.suggest + "/suggestions", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dish, submitted_by }),
        });
        if (!r.ok) throw new Error();
        b.textContent = "Thanks!";
      } catch (_) {
        b.disabled = false;
        alert("Couldn’t send that. Try again.");
      }
    });

    $("#search").addEventListener("input", (e) => { state.q = e.target.value; render(); });

    // ---- Boot ----
    function start() {
      if (!DATA.length) {
        menu.innerHTML = `<div class="empty"><h2>Kitchen’s closed</h2><p>The guide couldn’t reach the server. Try again in a moment.</p></div>`;
        return;
      }
      state.city = DATA[0].id;
      $("#footTotal").textContent = DATA.reduce((n, c) => n + c.count, 0);
      renderCities();
      renderCityHead();
      syncFilterBtn();
      render(true);
    }

    // Primary source of truth is Postgres via /api/places; fall back to the
    // statically-built data.js if the API is unreachable.
    menu.innerHTML = `<div class="empty"><h2>Loading the menu…</h2></div>`;
    fetch(API_BASE + "/api/places", { headers: { Accept: "application/json" } })
      .then((r) => { if (!r.ok) throw new Error("api"); return r.json(); })
      .then((d) => { DATA = (d && d.cities) || []; start(); })
      .catch(() => {
        DATA = (window.FOODIE_DATA && window.FOODIE_DATA.cities) || [];
        start();
      });
  })();
  </script>
</body>
</html>
